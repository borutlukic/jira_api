[workspace]
members = [".", "codegen"]

[package]
name = "jira_api"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
reqwest-middleware = { version = "0.5", features = ["query", "multipart"] }
reqwest-tracing = "0.7"
